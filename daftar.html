<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pendaftaran - Pemancingan Raja</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    />

    <style>
      /* Style khusus untuk halaman formulir pendaftaran */
      .register-section {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: #fff;
        padding-top: 12rem;
      }
      .form-container {
        background: #fff;
        padding: 4rem;
        border-radius: 1.5rem;
        box-shadow: 0 0.5rem 2rem rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 50rem;
      }
      .form-container h2 {
        font-size: 3rem;
        color: #1f3160;
        font-weight: 800;
        margin-bottom: 3rem;
        text-align: center;
      }
      .form-group {
        margin-bottom: 2rem;
      }
      .form-group label {
        display: block;
        font-size: 1.6rem;
        color: #333;
        margin-bottom: 0.8rem;
        font-weight: 600;
      }
      .form-group input,
      .form-group select {
        width: 100%;
        padding: 1.2rem 1.5rem;
        font-size: 1.6rem;
        border: 0.2rem solid #f1f1f1;
        border-radius: 1rem;
        background: #fff;
        color: #333;
        font-family: inherit;
      }
      .form-group input:focus,
      .form-group select:focus {
        border-color: #4643e8;
        outline: none;
      }
      .btn-submit {
        width: 100%;
        padding: 1.5rem;
        font-size: 1.8rem;
        background: #333;
        color: #fff;
        border: none;
        border-radius: 5rem;
        cursor: pointer;
        font-weight: 700;
        margin-top: 1rem;
        transition: 0.2s;
      }
      .btn-submit:hover {
        background: #4643e8;
      }
    </style>
  </head>
  <body>
    <header>
      <input type="checkbox" name="" id="toggler" />
      <label for="toggler" class="fas fa-bars"></label>

      <a href="dashboard-pelanggan.html" class="logo">Pemancingan Raja</a>

      <nav class="navbar">
        <a href="dashboard-pelanggan.html#Sistem">Sistem</a>
        <a href="dashboard-pelanggan.html#Lokasi">Lokasi</a>
        <a href="dashboard-pelanggan.html#Ulasan">Ulasan</a>
      </nav>

      <div class="icons">
        <a href="#" class="fa fa-history"></a>
        <a href="akun.html" class="fa fa-user"></a>
      </div>
    </header>

    <section class="register-section">
      <div class="form-container">
        <h2>Formulir Pendaftaran</h2>
        <form action="#">
          <div class="form-group">
            <label for="nama">Nama</label>
            <input
              type="text"
              id="nama"
              placeholder="Masukkan nama Anda"
              required
            />
          </div>

          <div class="form-group">
            <label for="wa">Nomor WhatsApp</label>
            <input
              type="text"
              id="wa"
              placeholder="Contoh: 081234567xxx"
              required
              pattern="[0-9]+"
              oninvalid="
                this.setCustomValidity('Tolong masukkan nomor yang benar')
              "
              oninput="this.setCustomValidity('')"
            />
          </div>

          <div class="form-group">
            <label for="tanggal">Pilih Tanggal Mancing</label>
            <input type="date" id="tanggal" required />
          </div>

          <div class="form-group">
            <label for="sistem">Pilih Sistem</label>
            <select id="sistem" required>
              <option value="" disabled selected hidden>
                -- Pilih Sistem Pemancingan --
              </option>
              <option value="harian">Sistem Harian Gabrukan</option>
              <option value="kiloan-bawal">Sistem Kiloan Ikan Bawal</option>
              <option value="kiloan-mas">Sistem Kiloan Ikan Mas</option>
              <option value="kiloan-lele">Sistem Kiloan Ikan Lele</option>
            </select>
          </div>

          <button type="submit" class="btn btn-submit">
            Kirim Pendaftaran
          </button>
        </form>
      </div>
    </section>

    <script>
      // 1. OTOMATISASI PENGISIAN FORM BERDASARKAN USER YANG LOGIN
      const sesi = JSON.parse(localStorage.getItem("sesi_login"));
      if (sesi && sesi.role === "pelanggan") {
        const inputNama = document.getElementById("nama");
        if (inputNama) {
          inputNama.value = sesi.nama;
          inputNama.readOnly = true; // Kunci nama asli pendaftar
        }

        const inputWA = document.getElementById("wa");
        if (inputWA) {
          inputWA.value = sesi.whatsapp || ""; // Otomatis mengisi nomor WA terdaftar
          inputWA.readOnly = true; // Kunci nomor WA asli pendaftar
        }
      }

      // 2. OTOMATIS MEMBATASI KALENDER BIAR GAK BISA PILIH HARI KEMARIN (MINIMAL HARI INI)
      const inputTanggal = document.getElementById("tanggal");
      if (inputTanggal) {
        const hariIni = new Date().toISOString().split("T")[0];
        inputTanggal.min = hariIni;
      }

      // 3. PROSES KIRIM PENDAFTARAN LAPAK
      const formDaftar = document.querySelector(".form-container form");
      if (formDaftar) {
        formDaftar.addEventListener("submit", function (e) {
          e.preventDefault();

          const dataBooking = {
            nama: document.getElementById("nama").value,
            whatsapp: document.getElementById("wa").value.trim(),
            tanggalMancing: document.getElementById("tanggal").value, // Mengambil format tanggal spesifik (YYYY-MM-DD)
            sistem: document.getElementById("sistem").value,
            waktuPendaftaran: new Date().toLocaleString("id-ID"),
            status: "Belum Ditimbang",
          };

          // Simpan ke database pendaftaran sementara di browser
          let dbPendaftaran =
            JSON.parse(localStorage.getItem("db_pendaftaran_mancing")) || [];
          dbPendaftaran.push(dataBooking);
          localStorage.setItem(
            "db_pendaftaran_mancing",
            JSON.stringify(dbPendaftaran),
          );

          // ARAHKAN KE HALAMAN SUKSES TANPA ALERT
          window.location.href = "sukses-daftar.html";

          // Mengubah urutan tampilan notifikasi tanggal Indonesia (DD/MM/YYYY)
          const infoTgl = dataBooking.tanggalMancing
            .split("-")
            .reverse()
            .join("/");
        });
      }
    </script>
  </body>
</html>
